name: Go

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -race -timeout=90s ./...
